name: Release

on:
  workflow_dispatch:
    inputs:
      chart-version:
        required: true
        type: string
        description: Chart Version
      proxy-version:
        required: true
        type: string
        description: Evaluation Proxy Version

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@5119fcb9089d432beecbf79bb2c7915207344b78 # v3

      - name: Helm Lint
        run: helm lint charts/evaluation-proxy

      - name: Set Chart Version
        uses: jacobtomlinson/gha-find-replace@f485fdc3f67a6d87ae6e3d11e41f648c26d7aee3 # v2
        with:
          find: 'version: .*'
          replace: 'version: ${{ github.event.inputs.chart-version }}'
          include: 'charts/evaluation-proxy/Chart.yaml'
          regex: true

      - name: Set Proxy Version
        uses: jacobtomlinson/gha-find-replace@f485fdc3f67a6d87ae6e3d11e41f648c26d7aee3 # v2
        with:
          find: 'appVersion: ".*"'
          replace: 'appVersion: "${{ github.event.inputs.proxy-version }}"'
          include: 'charts/evaluation-proxy/Chart.yaml'
          regex: true

      - name: Commit Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git commit -am "release: ${{ github.event.inputs.chart-version }}"
          git push

      - name: Release Chart
        uses: helm/chart-releaser-action@be16258da8010256c6e82849661221415f031968 # v1.5.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
